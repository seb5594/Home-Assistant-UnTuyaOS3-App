name: Validate apps
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install test tools
        run: |
          python -m pip install PyYAML==6.0.3
          sudo apt-get update
          sudo apt-get install -y apparmor-utils
      - name: Test safety decisions, HTTP and Linux PTY / descriptor transport
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript
        run: node --check untuyaos3/app/static/app.js
      - name: Validate and load enforcing AppArmor profiles
        run: |
          sudo apparmor_parser -r -T untuyaos3/apparmor.txt
          sudo apparmor_parser -r -T untuyaos3_wifi/apparmor.txt
      - name: Build main image
        run: docker build --tag untuyaos3:test untuyaos3
      - name: Build helper image
        run: docker build --tag untuyaos3-wifi:test untuyaos3_wifi
      - name: Smoke-test images under AppArmor
        run: |
          docker run --rm --security-opt apparmor=untuyaos3 --entrypoint python untuyaos3:test -c "import sslpsk3, Crypto, datastruct; import server; import subprocess; subprocess.run(['bash', '/opt/untuyaos3/UnTuyaOS3.sh', '--help'], check=True)"
          docker run --rm --security-opt apparmor=untuyaos3_wifi --entrypoint python untuyaos3-wifi:test -c "import broker; import subprocess; subprocess.run(['iw', '--version'], check=True); subprocess.run(['busctl', '--version'], check=True)"
