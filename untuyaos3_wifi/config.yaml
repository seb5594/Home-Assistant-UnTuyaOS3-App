name: UnTuyaOS3 Wi-Fi Helper
version: "0.1.1-beta.6"
slug: untuyaos3_wifi
description: Assigns one checked idle Wi-Fi radio to the isolated UnTuyaOS3 app
url: https://github.com/seb5594/Home-Assistant-UnTuyaOS3-App
arch:
  - amd64
  - aarch64
startup: application
boot: manual_only
stage: experimental
init: false
timeout: 60
host_network: true
host_dbus: true
privileged:
  - NET_ADMIN
apparmor: true
map:
  - type: share
    read_only: false
options:
  interface: ""
  pairing_token: ""
schema:
  interface: str
  pairing_token: password
