name: UnTuyaOS3
version: "0.1.1-beta.5"
slug: untuyaos3
description: Interactive UnTuyaOS3 with an isolated dedicated Wi-Fi radio and live logs
url: https://github.com/seb5594/Home-Assistant-UnTuyaOS3-App
arch:
  - amd64
  - aarch64
startup: application
boot: manual_only
stage: experimental
init: false
timeout: 30
ingress: true
ingress_port: 8099
ingress_stream: true
panel_title: UnTuyaOS3
panel_icon: mdi:chip
panel_admin: true
privileged:
  - NET_ADMIN
  - NET_RAW
apparmor: true
map:
  - type: share
    read_only: false
options:
  interface: ""
  pairing_token: ""
  run_timeout: 1800
schema:
  interface: str
  pairing_token: password
  run_timeout: int(60,7200)
